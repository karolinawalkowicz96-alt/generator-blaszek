name: One-time compact footer controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-index-once.yml

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove footer copy-all control and compact spacing
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('assets/app.js')
          s = app.read_text(encoding='utf-8')

          button = '      <button type="button" class="btn small" data-act="footer-all">Wpisz to samo we wszystkich projektach</button>\n'
          if button not in s:
              raise SystemExit('footer-all button not found')
          s = s.replace(button, '', 1)

          pattern = r"\n  else if\(act==='footer-all'\)\{.*?\n  \}\n  else if\(act==='bold'\)"
          s, n = re.subn(pattern, "\n  else if(act==='bold')", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'footer-all handler replacements: {n}')
          app.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          if 'assets/app.js?v=14' in h:
              h = h.replace('assets/app.js?v=14', 'assets/app.js?v=15', 1)
          h = h.replace('.foot{border-top:1px solid #e0e6ee;padding-top:16px}', '.foot{border-top:1px solid #e0e6ee;padding-top:13px}', 1)
          h = h.replace('.plate>.row{border-top:1px solid #e0e6ee;padding-top:15px}', '.plate>.row{border-top:1px solid #e0e6ee;padding-top:10px}', 1)
          index.write_text(h, encoding='utf-8')

      - name: Commit UI changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js index.html
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Remove footer copy-all control and compact card actions"
          git push origin HEAD:main
