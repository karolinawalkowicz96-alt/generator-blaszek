name: Boost clear button red
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boost-clear-red.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove temporary red workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make only the clear-list shade more vivid red
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.addplate{justify-content:flex-start;gap:10px}.addplate #clear-all{margin-left:auto}.addplate .medal-add'
          new = '.addplate{justify-content:flex-start;gap:10px}.addplate #clear-all{margin-left:auto;color:#c62828}.addplate #clear-all:hover{color:#b91c1c}.addplate .medal-add'
          if old not in s:
              raise SystemExit('Expected CSS fragment not found; no changes made')
          s2 = s.replace(old, new, 1)
          if s2 == s:
              raise SystemExit('No change made')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make clear list button red more vivid'
          git push origin HEAD:main
