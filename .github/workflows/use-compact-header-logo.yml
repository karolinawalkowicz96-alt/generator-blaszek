name: Use compact header logo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-compact-header-logo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace only the visible header logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='''/* Full supplied logo, preserving its proportions on every screen. */\n.brand-full{flex:0 1 345px;width:100%;max-width:345px;min-width:0}\n.brand-heading{width:100%;margin:0;line-height:0}\n.brand-full-logo{display:block;width:100%;height:auto;margin:-5.8% 0;transform:translateX(-3.2%)}\n@media(max-width:560px){.top{gap:0;padding:10px 0 8px;margin-bottom:8px}.brand-full{flex:0 1 320px;max-width:100%}.brand-full-logo{margin:-5.8% 0}.top .save-info{display:none}.top .save-info small{font-size:12px}}'''
          new_css='''/* Compact visible header logo; favicon/share icons stay unchanged. */\n.brand-full{flex:0 1 430px;width:100%;max-width:430px;min-width:0}\n.brand-heading{width:100%;margin:0;line-height:0}\n.brand-full-logo{display:block;width:100%;height:auto;margin:0;transform:none}\n@media(max-width:560px){.top{gap:0;padding:8px 0 6px;margin-bottom:6px}.brand-full{flex:0 1 360px;max-width:100%}.brand-full-logo{margin:0}.top .save-info{display:none}.top .save-info small{font-size:12px}}'''
          old_img='<h1 class="brand-heading"><img class="brand-full-logo" src="assets/logo-generator-blaszek.png?v=3" width="2048" height="686" alt="Generator Blaszek — Szybko i łatwo twórz blaszki ze spersonalizowanym napisem. by Dawid Tokarski" fetchpriority="high"></h1>'
          new_img='<h1 class="brand-heading"><img class="brand-full-logo" src="assets/logo-header-compact.png?v=1" width="1807" height="245" alt="Generator Blaszek by Dawid Tokarski" fetchpriority="high"></h1>'
          if old_css not in s:
              raise SystemExit('Old header CSS not found')
          if old_img not in s:
              raise SystemExit('Old header image tag not found')
          s=s.replace(old_css,new_css,1).replace(old_img,new_img,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit header-only change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/use-compact-header-logo.yml
          git add index.html
          git commit -m 'Use compact logo in page header'
          git push origin HEAD:main
