name: Compact footer controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove footer-all action and compact card spacing
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('assets/app.js')
          s = app.read_text(encoding='utf-8')
          button = '      <button type="button" class="btn small" data-act="footer-all">Wpisz to samo we wszystkich projektach</button>\n'
          if button in s:
              s = s.replace(button, '')

          pattern = r"\n  else if\(act==='footer-all'\)\{.*?\n  \}\n  else if\(act==='bold'\)"
          s2, n = re.subn(pattern, "\n  else if(act==='bold')", s, count=1, flags=re.S)
          if n:
              s = s2
          app.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('assets/app.js?v=14', 'assets/app.js?v=15')
          h = h.replace('.foot{border-top:1px solid #e0e6ee;padding-top:16px}', '.foot{border-top:1px solid #e0e6ee;padding-top:13px}')
          h = h.replace('.plate>.row{border-top:1px solid #e0e6ee;padding-top:15px}', '.plate>.row{border-top:1px solid #e0e6ee;padding-top:10px}')
          index.write_text(h, encoding='utf-8')
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js index.html
          git commit -m "Remove footer copy-all control and compact card actions"
          git push origin HEAD:main
