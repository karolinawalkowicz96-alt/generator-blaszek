name: Package site for download

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-site-download.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create ZIP
        shell: bash
        run: |
          zip -r generator-blaszek-strona.zip \
            index.html \
            assets \
            CZYTAJ-MNIE.txt \
            LICENCJA-CZCIONKI.txt
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: generator-blaszek-strona
          path: generator-blaszek-strona.zip
          if-no-files-found: error
          retention-days: 1
