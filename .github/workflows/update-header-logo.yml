name: Update header logo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-header-logo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install optimized header wordmark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          logo = '''UklGR+JP AABXRUJQVlA4INZP '''
          Path('assets/logo-header-wordmark.webp').write_bytes(base64.b64decode(logo))

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_img = '<img class="brand-full-logo" src="assets/logo-header-compact.png?v=1" width="1807" height="245" alt="Generator Blaszek by Dawid Tokarski" fetchpriority="high">'
          new_img = '<img class="brand-full-logo" src="assets/logo-header-wordmark.webp?v=2" width="1200" height="159" alt="Generator Blaszek by Dawid Tokarski" fetchpriority="high" decoding="async">'
          if old_img not in s:
              raise SystemExit('Current header image markup not found')
          s = s.replace(old_img, new_img, 1)

          old_css = '.brand-full-logo{display:block;width:100%;height:auto;margin:0;transform:none}'
          new_css = '.brand-full-logo{display:block;width:100%;height:auto;margin:0;transform:none;mix-blend-mode:multiply}'
          if old_css not in s:
              raise SystemExit('Current header logo CSS not found')
          s = s.replace(old_css, new_css, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit header logo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/logo-header-wordmark.webp
          git commit -m 'Fix and optimize visible header logo'
          git push origin HEAD:main
