name: Disable board feature and align clear button

on:
  push:
    paths:
      - '.github/workflows/disable-boards-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Temporarily disable the thank-you / certificate feature.
          s = s.replace('<script src="assets/boards.js?v=3" defer></script>\n', '')

          old = '''      </div>\n      <div class="list-tools"><button class="btn" id="clear-all" type="button">Wyczyść listę</button></div>'''
          new = '''        <button class="btn danger" id="clear-all" type="button">Wyczyść listę</button>\n      </div>'''
          if old not in s:
              raise SystemExit('Expected clear-list layout not found')
          s = s.replace(old, new, 1)

          # Remove styles used only by the separate lower clear-list row.
          s = s.replace('''\n.list-tools{display:flex;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}\n.list-tools #clear-all{margin:0;min-height:40px;padding:8px 12px;font-size:14px;color:#fff;background:#b42332;border:1px solid #b42332;border-radius:8px}\n.list-tools #clear-all:hover{color:#fff;background:#941c29;border-color:#941c29}\n''', '\n')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Temporarily disable certificate tool and align clear action"
          git push origin main
