name: Align empty state spacing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-empty-state-spacing.yml

permissions:
  contents: write

jobs:
  align-spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Make spacing consistent
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '.addplate{justify-content:space-between;align-items:center;margin-top:20px}'
          new1 = '.addplate{justify-content:space-between;align-items:center;margin-top:22px}'
          old2 = '.cards>.hint{text-align:center;padding:35px 15px;background:#f8fafd;border:1px dashed #bdcadb}'
          new2 = '.cards>.hint{text-align:center;padding:35px 15px;background:#f8fafd;border:1px dashed #bdcadb;margin-bottom:0}'
          if old1 not in s:
              raise SystemExit('Expected addplate spacing rule not found')
          if old2 not in s:
              raise SystemExit('Expected empty-state rule not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit change and remove one-off workflow
        shell: bash
        run: |
          git config user.name "generator-blaszek-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/align-empty-state-spacing.yml
          git add index.html
          git commit -m "Align empty-state button spacing"
          git push origin main
